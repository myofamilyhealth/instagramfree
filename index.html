<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#7BAFB2" />
  <title>Myo Family Health — Free Resources</title>
  <meta name="description" content="Free myofunctional therapy resources from Myo Family Health. Tap a topic to open the guide." />

  <!-- Open Graph (nice preview when shared from Instagram bio) -->
  <meta property="og:title" content="Myo Family Health — Free Resources" />
  <meta property="og:description" content="Free myofunctional therapy guides. Tap a topic to open." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/logo-tree.png" />

  <link rel="icon" type="image/png" href="assets/logo-tree.png" />
  <link rel="apple-touch-icon" href="assets/logo-tree.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?v=5" />

  <!-- Privacy-friendly analytics (set your code in analytics.js) -->
  <script src="analytics.js?v=4"></script>
</head>
<body>
  <!-- 9:16 mobile frame -->
  <main class="frame" role="main">
    <!-- Brand -->
    <header class="brand">
      <img class="brand__icon" src="assets/logo-tree.png" alt="Myo Family Health tree logo" width="120" height="120" />
      <!--
        Exact horizontal wordmark goes here. Drop the file in as
        assets/logo-wordmark.png and it appears automatically.
        Until then it stays hidden (no recreation of the logo).
      -->
      <img class="brand__wordmark" src="assets/logo-wordmark.png" alt="Myo Family Health"
           onerror="this.style.display='none'" />
      <!-- Accessible name for screen readers / SEO (visually hidden) -->
      <h1 class="sr-only">Myo Family Health</h1>
      <p class="brand__tagline">Free Myofunctional Therapy Resources</p>
    </header>

    <!-- 4 PDF sections get injected here -->
    <section class="sections" id="sections" aria-label="Free resource guides"></section>

    <!-- Email signup (Brevo embedded form) -->
    <section class="signup" aria-label="Join our email list">
      <iframe class="signup__frame"
              title="Join our email list"
              src="https://e3961feb.sibforms.com/v2/serve/MUIFAIp6RUy17cEz4RshfnfNGuq1fh4h4dR952P97BU-q72mx8NAH0Cw_ri4DzhxhMjd0BeXWM6INiNIwuXmWGAV_DkUjAnCOFtfaAo2WQhZUHN4Zj8p8l7jmq8Ht-sWyTnLOAs1nYwwg73AiX6yu7EeQ5ta5xoa2FZ3LvWUM3il6nmgCsEfgw1dTeAhVOdYfY7S52lTYAW9Tti1cA=="
              frameborder="0" scrolling="auto" allowfullscreen></iframe>
    </section>

    <footer class="foot">
      <p>Tap a topic to open the guide.</p>
      <p class="foot__copy">© <span id="year"></span> Myo Family Health</p>
    </footer>
  </main>

  <!-- PDF viewer / coming-soon modal -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel" role="document">
      <header class="modal__bar">
        <h2 class="modal__title" id="modalTitle"></h2>
        <button class="modal__close" type="button" aria-label="Close" data-close>&times;</button>
      </header>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
