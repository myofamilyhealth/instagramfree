<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Stats · Myo Family Health</title>
  <link rel="icon" type="image/png" href="assets/logo-tree.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet" />
  <style>
    :root{ --teal:#7BAFB2; --teal-deep:#5E9396; --mint:#EAF3F2; --mint-deep:#DCEAE9;
           --slate:#3D4A4E; --slate-soft:#6A777B; --offwhite:#F6FAF9; --line:rgba(61,74,78,.12); }
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{ font-family:"DM Sans",system-ui,sans-serif; color:var(--slate);
          background:radial-gradient(120% 60% at 50% 0%, var(--mint) 0%, var(--offwhite) 55%);
          min-height:100vh; display:flex; justify-content:center; -webkit-font-smoothing:antialiased; }
    .wrap{ width:100%; max-width:480px; padding:34px 22px 60px; }
    header{ text-align:center; margin-bottom:26px; }
    header img{ width:74px; height:74px; }
    h1{ font-family:"Newsreader",serif; font-size:1.5rem; font-weight:600; margin-top:10px; }
    .sub{ color:var(--slate-soft); font-size:.86rem; margin-top:4px; }

    .hero{ background:#fff; border:1px solid var(--line); border-radius:24px; padding:26px 22px;
           text-align:center; box-shadow:0 14px 34px -16px rgba(94,147,150,.3); margin-bottom:18px; }
    .hero .label{ font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--teal-deep); }
    .hero .num{ font-family:"Newsreader",serif; font-size:3.4rem; font-weight:600; line-height:1.05; color:var(--slate); margin:6px 0 2px; }
    .hero .unique{ font-size:.84rem; color:var(--slate-soft); }

    h2{ font-family:"Newsreader",serif; font-size:1.05rem; font-weight:600; margin:24px 4px 10px; }
    .row{ display:flex; align-items:center; justify-content:space-between; gap:14px;
          background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px; }
    .row .name{ font-weight:500; }
    .row .count{ font-family:"Newsreader",serif; font-size:1.3rem; font-weight:600; color:var(--teal-deep); min-width:48px; text-align:right; }

    .note{ font-size:.78rem; color:var(--slate-soft); line-height:1.5; margin-top:22px; text-align:center; }
    .note a{ color:var(--teal-deep); font-weight:600; }
    .msg{ background:var(--mint); border-radius:16px; padding:16px 18px; font-size:.86rem; color:var(--slate); line-height:1.5; margin-bottom:18px; }
    .msg strong{ color:var(--teal-deep); }
    .dash{ display:inline-block; margin-top:14px; background:var(--teal); color:#fff; text-decoration:none;
           font-weight:600; font-size:.9rem; padding:11px 20px; border-radius:999px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img src="assets/logo-tree.png" alt="Myo Family Health" />
      <h1>Site Stats</h1>
      <div class="sub">Private overview · Myo Family Health</div>
    </header>

    <div id="content"><!-- filled by JS --></div>

    <p class="note" id="footnote"></p>
  </div>

  <!-- Don't count visits to this private page -->
  <script>window.GC_NO_COUNT = true;</script>
  <script src="analytics.js"></script>
  <script>
    const GUIDES = [
      { slug: "breathing",       name: "Mouth & Nasal Breathing" },
      { slug: "tongue-posture",  name: "Tongue Posture & Swallowing" },
      { slug: "growing-smiles",  name: "Growing Smiles (Kids)" },
      { slug: "sleep-airway",    name: "Sleep & Airway Health" },
    ];

    const content = document.getElementById("content");
    const footnote = document.getElementById("footnote");
    const code = window.GC_CODE;

    function notConfigured() {
      content.innerHTML = `
        <div class="msg">
          <strong>Analytics isn't switched on yet.</strong><br>
          Create a free account at <a href="https://www.goatcounter.com" target="_blank" rel="noopener">goatcounter.com</a>,
          then put your code in <code>analytics.js</code> and re-deploy.
          Counts will appear here automatically.
        </div>`;
    }

    async function counter(path) {
      // GoatCounter public visitor counter endpoint
      const url = `https://${code}.goatcounter.com/counter/${encodeURIComponent(path)}.json`;
      const res = await fetch(url, { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error(res.status);
      return res.json(); // { count: "1,234", count_unique: "567" }
    }

    async function load() {
      if (!code) { notConfigured(); footnote.textContent = ""; return; }

      let total;
      try {
        total = await counter("TOTAL");
      } catch (e) {
        content.innerHTML = `
          <div class="msg">
            Couldn't load the live counter. Make sure <strong>“Allow visitor counts”</strong>
            is ticked in GoatCounter → Settings → Site settings.
            <br><a class="dash" href="https://${code}.goatcounter.com" target="_blank" rel="noopener">Open full dashboard →</a>
          </div>`;
        return;
      }

      let html = `
        <div class="hero">
          <div class="label">Total page views</div>
          <div class="num">${total.count ?? "0"}</div>
          <div class="unique">${total.count_unique ?? "0"} unique visitors</div>
        </div>
        <h2>Guide opens</h2>`;

      // Fetch each guide's open-count in parallel
      const results = await Promise.all(GUIDES.map(async g => {
        try { const c = await counter("guide-" + g.slug); return c.count ?? "0"; }
        catch { return "0"; }
      }));

      GUIDES.forEach((g, i) => {
        html += `<div class="row"><span class="name">${g.name}</span><span class="count">${results[i]}</span></div>`;
      });

      content.innerHTML = html;
      footnote.innerHTML = `Numbers are approximate and update with a short delay. ·
        <a href="https://${code}.goatcounter.com" target="_blank" rel="noopener">Open full dashboard →</a>`;
    }

    load();
  </script>
</body>
</html>
